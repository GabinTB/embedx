name: CI

# The Docker image is DELIBERATELY NOT BUILT here, and this omission is not
# an oversight to be fixed. The CUDA base plus torch's bundled CUDA libraries
# come to ~12 GB; building it on every push would dominate CI time and cache
# storage for a check that a hosted runner cannot complete anyway -- it has
# no GPU, so it could not run the image even after building it.
#
# What IS checked: tests/test_docker.py statically asserts the properties
# that would silently rot (runtime C toolchain, cache paths, loopback
# publish, the sm_120 build gate, the two vendor build args), and validates
# the compose file with `docker compose config` when Docker happens to be
# present. The claims those guard were verified against a real build on a
# Blackwell + A400 host; DEPLOY.md documents how to re-verify them.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      # CPU-only CI: the `gpu` extra is intentionally not installed, so this
      # also enforces that core stays importable without torch.
      - name: Install dev environment
        run: uv sync --extra dev

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy src/embedx

      - name: Pytest (CPU)
        run: uv run pytest -m "not gpu"

  # End-to-end proof of the torch-free core rule that the ast guard test
  # only checks statically: the built wheel must install and run without
  # the gpu extra.
  package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build wheel and sdist
        run: uv build

      - name: Install the wheel into a clean env (no gpu extra)
        run: |
          uv venv /tmp/smoke --python ${{ matrix.python-version }}
          uv pip install --python /tmp/smoke/bin/python dist/*.whl

      - name: Torch-free import and CLI smoke
        run: |
          /tmp/smoke/bin/python -c "import embedx; print(embedx.__version__)"
          /tmp/smoke/bin/embedx --help
          /tmp/smoke/bin/embedx info --model-id smoke-test --pooling mean
