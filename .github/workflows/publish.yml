name: Publish

# Publishes the LIBRARY distribution `embedx-inference` to PyPI on a version
# tag, using GitHub Actions OIDC (PyPI "Trusted Publishing"). There is no API
# token in this repository, in Actions secrets, or on any machine: PyPI
# verifies a short-lived OIDC claim naming this repository, this workflow
# FILE, and the `pypi` environment. Renaming this file or that environment
# breaks publishing until the pending publisher on pypi.org is updated to
# match, so neither is a cosmetic change.
#
# The Docker image is NOT built here. It is ~12.3 GB and a GitHub-hosted
# runner starts with roughly 21 GB free, of which the build needs 20-25 GB
# (the 7.36 GB /opt/venv layer is materialised in both the builder and the
# runtime stage). It would need a disk-cleanup step to fit at all, and the
# runner has no GPU, so it could not verify the image it published. See
# `make image-push` and DEPLOY.md for the documented manual path.

on:
  push:
    tags: ["v*"]
  # The dry run. See the `testpypi` job.
  workflow_dispatch:

permissions: {}

jobs:
  # Build once, publish that exact artifact. Neither publish job builds its
  # own, so what PyPI receives is what was checked here.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      # A tag that disagrees with the version publishes a wheel nobody can
      # correlate with a release, and neither the tag nor the upload can be
      # corrected afterwards. Checked before the build, not after.
      - name: The tag must match the version in pyproject.toml
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python - <<'PY'
          import os, sys, tomllib
          tag = os.environ["GITHUB_REF_NAME"]
          version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          if tag != f"v{version}":
              sys.exit(
                  f"tag {tag!r} does not match pyproject version {version!r} "
                  f"(expected tag 'v{version}'). Fix one of them before publishing: "
                  "a mismatched upload cannot be withdrawn."
              )
          print(f"tag {tag} matches pyproject version {version}")
          PY

      # DEFAULT target on purpose: no EMBEDX_BUILD_SERVER here, so this is the
      # library wheel. The next step proves it rather than trusting it.
      - name: Build
        run: uv build

      - name: The artifact must be the library wheel
        run: python scripts/check_library_wheel.py dist

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # Real publish, tags only.
  pypi:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/embedx-inference
    permissions:
      # The whole point: this mints the OIDC token PyPI checks. Nothing else
      # is granted, and `permissions: {}` at the top means nothing is
      # inherited either.
      id-token: write
    steps:
      # Checked out only for the check script -- not to rebuild anything.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # Deliberately the same assertion as in `build`, re-run here against the
      # bytes about to be uploaded. A wheel cannot be un-published, so this is
      # the last line of defence and it is worth the duplicate run.
      - name: Last check before upload
        run: python scripts/check_library_wheel.py dist

      - uses: pypa/gh-action-pypi-publish@release/v1

  # Dry run. Invoke from the Actions tab: "Publish" -> "Run workflow" on
  # main. Publishing to TestPyPI needs its OWN pending publisher registered at
  # test.pypi.org, with environment `testpypi` -- the OIDC claim is per-index.
  testpypi:
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/embedx-inference
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Last check before upload
        run: python scripts/check_library_wheel.py dist

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          # TestPyPI keeps whatever was uploaded first for a given version, so
          # a repeated dry run of an unchanged version would otherwise fail the
          # whole job on a file that is already there.
          skip-existing: true
