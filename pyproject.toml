[project]
name = "embedx"
version = "0.1.0"
description = "Heterogeneous multi-GPU text embedding server with length-sorted token-budget batching and a converging work-stealing queue. OpenAI-compatible /v1/embeddings API."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Gabin" }]
keywords = [
    "embeddings",
    "inference",
    "gpu",
    "multi-gpu",
    "sentence-transformers",
    "openai",
    "server",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Runtime dependencies are intentionally minimal at the core.
# Torch / transformers are heavy and are declared as an optional extra so the
# package metadata and CLI can be imported and tested without a GPU stack.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "numpy>=1.26",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
# The inference backend. Kept separate so `embedx` core stays importable in CI
# without pulling multi-GB CUDA wheels.
gpu = [
    "torch>=2.3",
    "transformers>=4.44",
    "sentence-transformers>=3.0",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
embedx = "embedx.cli:app"

[project.urls]
Homepage = "https://github.com/GabinTB/embedx"
Repository = "https://github.com/GabinTB/embedx"
Issues = "https://github.com/GabinTB/embedx/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/embedx"]
# Package data rides along with the package dir; force-include pins the
# systemd unit explicitly so it cannot fall out of the wheel unnoticed
# (tests resolve it through importlib.resources).
[tool.hatch.build.targets.wheel.force-include]
"src/embedx/service/embedx.service" = "embedx/service/embedx.service"

[tool.hatch.build.targets.sdist]
include = [
    "src",
    "tests",
    "DEPLOY.md",
    "README.md",
    "LICENSE",
    "Makefile",
]

# ------------------------------------------------------------------------- #
# Tooling
# ------------------------------------------------------------------------- #

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# dev/ holds exploratory notebooks; ruff lints .ipynb by default and the
# gate runs `ruff check .`, so exclude them (pytest already scopes to tests/).
exclude = ["dev"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
ignore = [
    "N812", # allow lowercase imported-as (e.g. functional as F)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"] # asserts are fine in tests

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --cov=embedx --cov-report=term-missing"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "gpu: marks tests that require a CUDA GPU (deselect with '-m \"not gpu\"')",
    "slow: marks slow tests",
]

[tool.mypy]
# 3.12 (not 3.11) because numpy's stubs use PEP 695 `type` statements,
# which mypy rejects under a 3.11 target. Runtime support stays >=3.11.
python_version = "3.12"
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
files = ["src/embedx"]
