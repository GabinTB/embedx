[project]
# Distribution name, NOT the import name -- `import embedx` is unchanged.
# They differ because `embedx` on PyPI has belonged to an unrelated 2016
# project since before this one existed, and PyPI normalises `embedX` to
# `embedx`, so the short name cannot be claimed. Splitting the two is
# ordinary (scikit-learn/sklearn, beautifulsoup4/bs4, opencv-python/cv2).
#
# What this distribution ships is the LIBRARY: batching, the converging
# scheduler, the Engine, device ranking and budgets, the model registry and
# config. The HTTP server (`embedx.api`, `embedx serve`) is excluded from the
# wheel -- see [tool.hatch.build.targets.wheel] -- and ships via Docker or a
# source install, which is where the Python/torch/CUDA/toolchain combination
# is pinned and tested together.
name = "embedx-inference"
version = "0.2.0"
description = "Heterogeneous multi-GPU text embedding server with length-sorted token-budget batching and a converging work-stealing queue. OpenAI-compatible /v1/embeddings API."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Gabin" }]
keywords = [
    "embeddings",
    "inference",
    "gpu",
    "multi-gpu",
    "sentence-transformers",
    "openai",
    "server",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Runtime dependencies are intentionally minimal at the core.
# Torch / transformers are heavy and are declared as an optional extra so the
# package metadata and CLI can be imported and tested without a GPU stack.
#
# Nothing HTTP is here. fastapi, anyio and uvicorn moved to the `server`
# extra when the wheel stopped shipping `embedx.api`: a library install
# should not drag in a web framework it has no module to use.
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "numpy>=1.26",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
# The HTTP layer. Only meaningful alongside a source or Docker install, since
# the PyPI wheel excludes `embedx.api` -- installing this extra from PyPI
# gives you the dependencies of a server whose modules are not there. It is
# declared so the source install has one name for them, and so a reader can
# see at a glance which dependencies belong to the server half.
server = [
    "fastapi>=0.115",
    # Direct: app.py uses anyio's semaphore and fail_after for the request
    # admission cap. It arrives transitively through starlette anyway, but
    # imported code is a dependency whether or not something else pulls it.
    "anyio>=4.0",
    "uvicorn[standard]>=0.30",
]
# The inference backend. Kept separate so `embedx` core stays importable in CI
# without pulling multi-GB CUDA wheels.
gpu = [
    "torch>=2.3",
    "transformers>=4.44",
    "sentence-transformers>=3.0",
]
dev = [
    # The dev environment is a SOURCE checkout, so it gets the server half
    # too: tests/test_api.py imports embedx.api, and the gate must exercise
    # the HTTP layer even though the wheel does not ship it.
    "embedx-inference[server]",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    # Tooling for the dev/ notebooks. They are not part of the package and are
    # excluded from ruff, but they are the validation evidence, so the stack to
    # run them is pinned here rather than left to ad-hoc `--with` flags.
    # `datasets` is what notebooks 02 and 03 load the real corpus with; torch
    # and transformers come from the `gpu` extra, which 03 additionally needs.
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
    "matplotlib>=3.8",
    "datasets>=2.20",
]

[project.scripts]
embedx = "embedx.cli:app"

[project.urls]
Homepage = "https://github.com/GabinTB/embedx"
Repository = "https://github.com/GabinTB/embedx"
Issues = "https://github.com/GabinTB/embedx/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/embedx"]
# THE SPLIT. The wheel ships the library; the server half is left out of it.
# This is a build-configuration exclusion, not a restructure: one source
# tree, one pyproject, and a source or Docker install still gets everything.
#
# Two things are server-side. `api/` is the HTTP layer. `service/` is the
# systemd unit, whose ExecStart runs `embedx serve` -- absent from a library
# wheel, so shipping the unit there would be handing someone a file that
# cannot work. Both are governed by one flag; see hatch_build.py.
#
# `embedx serve` registers conditionally on `embedx.api` being importable
# (see cli.py), so on a wheel install the subcommand is simply absent rather
# than present and broken. The CI packaging job asserts every half of this
# -- no `embedx/api/` member, no unit file, and no `serve` in `--help` --
# because an exclusion nobody checks is one that silently stops working.
#
# Both entries must stay in step with hatch_build.py's SERVER_SOURCES;
# tests/test_service.py fails if they drift apart.
exclude = ["src/embedx/api", "src/embedx/service"]

# ...and back in for server installs. `pip install .` builds the wheel target
# above, so without this a source or Docker install would lose the server half
# too, not just PyPI. `EMBEDX_BUILD_SERVER=1` re-includes it; see hatch_build.py
# for why the default points the way it does.
[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = [
    "src",
    "tests",
    "CHANGELOG.md",
    "DEPLOY.md",
    "README.md",
    "LICENSE",
    "Makefile",
]

# ------------------------------------------------------------------------- #
# Tooling
# ------------------------------------------------------------------------- #

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# dev/ holds exploratory notebooks; ruff lints .ipynb by default and the
# gate runs `ruff check .`, so exclude them (pytest already scopes to tests/).
exclude = ["dev"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
ignore = [
    "N812", # allow lowercase imported-as (e.g. functional as F)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"] # asserts are fine in tests

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --cov=embedx --cov-report=term-missing"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "gpu: marks tests that require a CUDA GPU (deselect with '-m \"not gpu\"')",
    "slow: marks slow tests",
]

[tool.mypy]
# 3.12 (not 3.11) because numpy's stubs use PEP 695 `type` statements,
# which mypy rejects under a 3.11 target. Runtime support stays >=3.11.
python_version = "3.12"
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
files = ["src/embedx"]
